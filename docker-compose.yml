version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-pdf_tools}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-pdf_tools}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 8080
      APP_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-pdf_tools}
      DATABASE_SSLMODE: disable
      STORAGE_UPLOAD_DIR: /app/storage/uploads
      STORAGE_OUTPUT_DIR: /app/storage/outputs
      MAX_FILE_SIZE_MB: 50
      COMPRESSOR_ENGINE: ghostscript
      COMPRESS_TIMEOUT_SECONDS: 120
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_DURATION_SECONDS: 60
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - storage_uploads:/app/storage/uploads
      - storage_outputs:/app/storage/outputs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdf_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  storage_uploads:
  storage_outputs:
